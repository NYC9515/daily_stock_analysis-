name: Daily Analysis Scheduler

on:
  # Beijing 18:07 = UTC 10:07 (weekdays)
  schedule:
    - cron: '7 10 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily analysis workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"mode":"full","force_run":"false"}}'
          curl -sSf \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily_analysis.yml/dispatches \
            -d "${payload}"
          echo "Dispatched daily_analysis.yml successfully."
